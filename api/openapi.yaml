basePath: /
definitions:
  Departure:
    properties:
      cancelled:
        type: boolean
      countdownMinutes:
        type: integer
      destination:
        type: string
      estimatedTime:
        type: string
      id:
        type: string
      line:
        type: string
      plannedTime:
        type: string
      platform:
        type: string
    type: object
  DeparturesResponse:
    properties:
      departures:
        items:
          $ref: '#/definitions/Departure'
        type: array
      generatedAt:
        type: string
    type: object
  GeoPoint:
    properties:
      lat:
        type: number
      lon:
        type: number
    type: object
  Journey:
    properties:
      arrivalTime:
        type: string
      departureTime:
        type: string
      distanceM:
        type: number
      durationMinutes:
        type: integer
      id:
        type: string
      interchanges:
        type: integer
      legs:
        items:
          $ref: '#/definitions/JourneyLeg'
        type: array
      messages:
        items:
          type: string
        type: array
      summary:
        type: string
    type: object
  JourneyLeg:
    properties:
      destination:
        type: string
      destinationName:
        type: string
      destinationTime:
        type: string
      durationMinutes:
        type: integer
      geometry:
        items:
          $ref: '#/definitions/GeoPoint'
        type: array
      id:
        type: string
      line:
        type: string
      messages:
        items:
          type: string
        type: array
      mode:
        $ref: '#/definitions/domain.LegMode'
      originName:
        type: string
      originTime:
        type: string
      platform:
        type: string
      routeDescription:
        type: string
      stops:
        items:
          $ref: '#/definitions/JourneyStop'
        type: array
    type: object
  JourneyStop:
    properties:
      arrivalTime:
        type: string
      departureTime:
        type: string
      id:
        type: string
      lat:
        type: number
      lon:
        type: number
      name:
        type: string
    type: object
  JourneysResponse:
    properties:
      generatedAt:
        type: string
      journeys:
        items:
          $ref: '#/definitions/Journey'
        type: array
    type: object
  LiveTrafficStatus:
    properties:
      enabled:
        type: boolean
      positionModel:
        type: string
    type: object
  LiveVehicle:
    properties:
      bearing:
        type: number
      confidence:
        $ref: '#/definitions/livetraffic.Confidence'
      delaySeconds:
        type: integer
      direction:
        type: string
      distanceM:
        type: number
      estimatedAt:
        type: string
      lat:
        type: number
      line:
        type: string
      lon:
        type: number
      mode:
        $ref: '#/definitions/livetraffic.VehicleMode'
      nextStop:
        type: string
      previousStop:
        type: string
      routeId:
        type: string
      runId:
        type: string
      shapeId:
        type: string
      source:
        $ref: '#/definitions/livetraffic.PositionSource'
      status:
        $ref: '#/definitions/livetraffic.VehicleStatus'
      tripId:
        type: string
    type: object
  Location:
    properties:
      id:
        type: string
      lat:
        type: number
      lon:
        type: number
      name:
        type: string
      type:
        $ref: '#/definitions/domain.LocationType'
    type: object
  LocationsResponse:
    properties:
      locations:
        items:
          $ref: '#/definitions/Location'
        type: array
    type: object
  Place:
    properties:
      id:
        type: string
      lat:
        type: number
      lon:
        type: number
      name:
        type: string
      type:
        $ref: '#/definitions/domain.LocationType'
    type: object
  SearchJourneyRequest:
    properties:
      dateTime:
        type: string
      destination:
        $ref: '#/definitions/Place'
      destinationId:
        type: string
      origin:
        $ref: '#/definitions/Place'
      originId:
        type: string
      timeMode:
        type: string
    type: object
  VehicleSnapshot:
    properties:
      degraded:
        type: boolean
      generatedAt:
        type: string
      positionModel:
        type: string
      snapshotAgeSeconds:
        type: integer
      vehicles:
        items:
          $ref: '#/definitions/LiveVehicle'
        type: array
    type: object
  domain.LegMode:
    enum:
    - walk
    - stadtbahn
    - s-bahn
    - bus
    type: string
    x-enum-varnames:
    - LegModeWalk
    - LegModeStadtbahn
    - LegModeSBahn
    - LegModeBus
  domain.LocationType:
    enum:
    - stop
    - address
    - poi
    - coord
    type: string
    x-enum-varnames:
    - LocationTypeStop
    - LocationTypeAddress
    - LocationTypePOI
    - LocationTypeCoord
  livetraffic.Confidence:
    enum:
    - low
    - medium
    - high
    type: string
    x-enum-varnames:
    - ConfidenceLow
    - ConfidenceMedium
    - ConfidenceHigh
  livetraffic.PositionSource:
    enum:
    - schedule
    - realtime_inferred
    - measured
    type: string
    x-enum-varnames:
    - PositionSourceSchedule
    - PositionSourceRealtimeInferred
    - PositionSourceMeasured
  livetraffic.VehicleMode:
    enum:
    - tram
    - light-rail
    - s-bahn
    - bus
    - rail
    type: string
    x-enum-varnames:
    - VehicleModeTram
    - VehicleModeLightRail
    - VehicleModeSBahn
    - VehicleModeBus
    - VehicleModeRail
  livetraffic.VehicleStatus:
    enum:
    - not_started
    - at_stop
    - in_transit
    - completed
    type: string
    x-enum-varnames:
    - VehicleStatusNotStarted
    - VehicleStatusAtStop
    - VehicleStatusInTransit
    - VehicleStatusCompleted
  respond.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/respond.errorBody'
    type: object
  respond.errorBody:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: HTTP API for real-time transport searches backed by TRIAS.
  title: Transit Simulator API
  version: "1.0"
paths:
  /api/v1/health:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Service health
      tags:
      - system
  /api/v1/journeys:
    post:
      consumes:
      - application/json
      parameters:
      - description: Journey search
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SearchJourneyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JourneysResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/respond.ErrorEnvelope'
      summary: Search journeys
      tags:
      - journeys
  /api/v1/live/status:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LiveTrafficStatus'
      summary: Get live traffic status
      tags:
      - live-traffic
  /api/v1/live/vehicles:
    get:
      parameters:
      - description: Viewport southern latitude
        in: query
        name: latMin
        required: true
        type: number
      - description: Viewport western longitude
        in: query
        name: lonMin
        required: true
        type: number
      - description: Viewport northern latitude
        in: query
        name: latMax
        required: true
        type: number
      - description: Viewport eastern longitude
        in: query
        name: lonMax
        required: true
        type: number
      - description: Comma-separated modes
        in: query
        name: modes
        required: true
        type: string
      - description: RFC3339 timestamp for deterministic replay
        in: query
        name: at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/VehicleSnapshot'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/respond.ErrorEnvelope'
      summary: Get live vehicle snapshot
      tags:
      - live-traffic
  /api/v1/live/vehicles/{runId}:
    get:
      parameters:
      - description: Dated scheduled run ID
        in: path
        name: runId
        required: true
        type: string
      - description: RFC3339 timestamp for deterministic replay
        in: query
        name: at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LiveVehicle'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/respond.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorEnvelope'
      summary: Get a live vehicle estimate
      tags:
      - live-traffic
  /api/v1/live/vehicles/stream:
    get:
      parameters:
      - description: Last received SSE event ID
        in: header
        name: Last-Event-ID
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE event stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/respond.ErrorEnvelope'
      summary: Stream live vehicle updates
      tags:
      - live-traffic
  /api/v1/locations:
    get:
      parameters:
      - description: Location search query
        in: query
        name: query
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LocationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/respond.ErrorEnvelope'
      summary: Search locations
      tags:
      - locations
  /api/v1/locations/nearby:
    get:
      parameters:
      - description: Latitude
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude
        in: query
        name: lon
        required: true
        type: number
      - default: 700
        description: Search radius in metres
        in: query
        name: radiusM
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LocationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/respond.ErrorEnvelope'
      summary: Find nearby locations
      tags:
      - locations
  /api/v1/stations/{stationId}/departures:
    get:
      parameters:
      - description: Station identifier
        in: path
        name: stationId
        required: true
        type: string
      - description: Station name
        in: query
        name: name
        type: string
      - description: Latitude
        in: query
        name: lat
        type: number
      - description: Longitude
        in: query
        name: lon
        type: number
      - description: RFC3339 timestamp
        in: query
        name: at
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DeparturesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/respond.ErrorEnvelope'
      summary: Get station departures
      tags:
      - departures
  /version:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get build version
      tags:
      - system
swagger: "2.0"
